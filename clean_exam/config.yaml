# ============================================================================
#  깔끔 시험지 — 모든 조정 가능한 값은 이 파일 한 곳에만 있다.
#  각 항목 옆 주석은 "이 값을 올리면 어떻게 되는지"를 설명한다.
# ============================================================================

# --- 강사 목록 (2단계 웹 화면의 드롭다운에 그대로 뜬다) ---------------------
teachers:
  - "강사1"
  - "강사2"
  - "강사3"

# --- Claude API ------------------------------------------------------------
claude:
  # 가성비 기본값. 판정관처럼 "짧은 판정을 여러 번" 하는 용도.
  fast_model: "claude-haiku-4-5"
  # 고품질 옵션. 3단계 자동 라벨링처럼 정확도가 비용보다 중요한 용도.
  quality_model: "claude-opus-5"
  # 중간 선택지(원하면 quality_model 자리에 넣어 쓴다): "claude-sonnet-5"

  max_crops_per_call: 8      # 한 번의 호출에 붙이는 조각(이미지) 개수.
                             # 올리면 → 호출 수가 줄어 비용↓, 대신 한 응답이 길어지고
                             #          조각 하나하나에 대한 주의력이 떨어져 정확도↓.
  max_judge_calls_per_page: 10  # 사진 한 장당 판정관 호출 상한(비용 폭주 방지).
                             # 올리면 → 애매한 획을 더 많이 물어봐 정확도↑, 비용↑.
  crop_max_side_px: 300      # 조각 하나의 최대 한 변 길이(px).
                             # 올리면 → 조각에 맥락이 더 담겨 판정 정확도↑, 토큰↑(비용↑).
  crop_padding_px: 12        # 조각을 자를 때 둘레에 더 주는 여백.
                             # 올리면 → "인쇄 글자 위에 겹쳐 쓴 필기"처럼 주변을 봐야
                             #          아는 경우의 정확도↑, 대신 이미지가 커진다.
  page_max_side_px: 1500     # 전체 페이지를 보낼 때(2단계 검수) 줄이는 크기.
  confidence_threshold: 0.6  # 판정관 confidence 가 이 값 미만이면 "인쇄"(안 지움)로 안전 처리.
                             # 올리면 → 지우는 데 더 신중해짐(인쇄 보호↑, 필기 잔존↑).
  timeout_seconds: 60
  max_retries: 2
  use_prompt_cache: true     # 시스템 프롬프트(길고 매번 같음)를 캐싱해 비용을 줄인다.

  # 단가표 (USD / 1M tokens). 출처: Anthropic 공식 가격 페이지.
  # ※ 가격은 바뀌므로 주기적으로 확인해 갱신할 것.
  pricing:
    claude-haiku-4-5:  { input: 1.00, output: 5.00 }
    claude-sonnet-5:   { input: 2.00, output: 10.00 }
    claude-opus-5:     { input: 5.00, output: 25.00 }
  usd_to_krw: 1400           # 화면에 원화로 보여줄 때 쓰는 환율. 실제 환율로 갱신할 것.

# --- 1) 사진 보정 ----------------------------------------------------------
preprocess:
  work_max_side_px: 2500     # 처리용으로 줄이는 크기.
                             # 올리면 → 가는 획까지 살아 정확도↑, 처리 시간↑(제곱으로 늘어남).
  work_min_side_px: 1100     # 긴 변이 이보다 작은 사진은 처리 전에 이 크기로 **키운다**.
                             # 픽셀 단위 기준값들이 1500px 안팎 사진에 맞춰져 있어서, 335px 짜리
                             # 사진을 그대로 넣으면 색펜 제거 34%·컬러 인쇄 손실 52% 로 무너졌다.
                             # 결과는 원래 크기로 되돌린다. 내리면 → 작은 사진에서 정확도↓.
  auto_orient: true          # 90/180/270도 돌아간 사진을 세로로 되돌린다.

  paper_detect:
    enabled: true
    canny_low: 50            # 올리면 → 약한 경계는 무시 → 종이 윤곽을 덜 찾는다.
    canny_high: 150
    min_area_ratio: 0.25     # 찾은 사각형이 화면의 이 비율보다 작으면 종이로 인정 안 함.
                             # 올리면 → 엉뚱한 작은 사각형을 종이로 오인할 위험↓,
                             #          대신 멀리서 찍은 사진에서 검출 실패↑.
    approx_epsilon_ratio: 0.02  # 윤곽선을 사각형으로 단순화하는 정도.
                             # 올리면 → 더 과감히 4각형으로 뭉갠다(곡선 종이에 관대, 오검출↑).

  deskew:
    enabled: true
    max_angle_deg: 20        # 이 각도 넘게 기울었다고 나오면 오검출로 보고 무시한다.
                             # 올리면 → 심하게 기운 사진도 펴지만, 엉뚱한 회전 위험↑.
    min_angle_deg: 1.0       # 이 각도보다 덜 기울었으면 아예 돌리지 않는다.
                             # 회전은 캔버스를 키우고 화질을 뭉개므로, 측정 잡음(필기가 많은
                             # 페이지에서 0.5~0.9도) 때문에 곧은 사진을 건드리면 손해다.
                             # 실측 비교(50장 보정 정확도 / 곧은 페이지 크기 보존):
                             #   0.8 → 92% / 3장 중 3,  1.0 → 92% / 4장 중 4,  1.2 → 90% / 4장 중 4
                             # 내리면 → 더 꼼꼼히 펴지만 곧은 사진도 매번 크기가 바뀐다.
    max_passes: 3            # 기울기 보정을 최대 몇 번 반복할지.
                             # 크게 기운 사진은 한 번에 안 펴진다(실측: 12도 사진이 1회 보정 뒤
                             # 1.3도 남음 → 3회면 0.3도 아래). 올리면 → 정확↑, 시간↑(회당 0.1초).

  dewarp:
    enabled: false           # 제본된 문제집처럼 휘어진 종이를 가로 띠별로 펴기.
                             # 켜면 → 곡선 줄이 수평에 가까워지지만, 글자가 미세하게
                             #        늘어날 수 있다. 원본 배치 보존이 중요하면 끈 채로 둔다.
    band_count: 12           # 올리면 → 더 잘게 펴서 곡선 대응↑, 띠 경계 이음매 티↑.

  illumination:
    background_kernel_px: 41 # 배경(조명) 추정용 큰 커널 크기. 홀수여야 한다.
                             # 올리면 → 넓은 그림자를 더 잘 잡지만, 굵은 글자를 배경으로
                             #          오인해 흐려질 수 있다. 글자 굵기의 3~5배가 적당.
    plateau_kernel_px: 301   # 두 번째(큰) 배경 추정 커널. 이보다 작은 유계 어두운 면(색칠된 반원,
                             # 표 칸, 막대)은 종이가 아니라 인쇄로 보고 배경에서 뺀다.
                             # 내리면 → 작은 회색 면만 지킨다. 올리면 → 손 그림자까지 인쇄로 봐서 안 편다.
    plateau_ratio: 0.85      # 작은 커널 배경이 큰 커널 배경의 이 비율보다 어두우면 "유계 어두운 면".
                             # 올리면 → 연한 회색 면도 잡는다(종이 얼룩까지 인쇄로 볼 위험↑).
    plateau_min_area_px: 400 # 이보다 작은 회색 면은 무시한다(글자 하나가 우연히 걸린 것).
    plateau_max_area_ratio: 0.15  # 페이지의 이 비율보다 큰 회색 면은 조명(그림자)이지 그림이 아니다.
                             # 이미지 테두리에 닿는 면도 같은 이유로 코드에서 버린다.
    clip_percentile: 92.0    # 이 분위수의 밝기를 흰색(255)으로 맞춘다.
                             # 내리면 → 종이가 더 확실히 하얘지지만 흐린 인쇄가 날아갈 수 있다.
                             # 99 로 두었더니 종이가 225~239 에 머물러 결과가 회색빛이었다.

  quality:
    blur_laplacian_min: 100.0   # 라플라시안 분산이 이 값 미만이면 "흐린 사진" 경고.
    dark_mean_min: 90.0         # 평균 밝기가 이 값 미만이면 "어두운 사진" 경고.
    paper_area_ratio_min: 0.40  # 시험지가 화면의 이 비율 미만이면 "너무 작게 찍음" 경고.

# --- 2) 색 기반 필기 제거 (빨강·파랑 펜, 채점 표시) ------------------------
color_filter:
  enabled: true
  saturation_threshold: 60   # 채도 기준의 **기본값**. 사진에서 색이 두 무리로 갈리지 않을 때
                             # (= 색펜이 없는 흑백 시험지) 이 값을 쓴다.
                             # 내리면 → 연한 색펜까지 지우지만, 누런 종이·컬러 인쇄도
                             #          같이 지울 위험↑. 올리면 → 진한 색만 지운다.
  saturation_threshold_floor: 15    # 사진에서 자동으로 정한 기준의 하한.
                             # 이보다 낮게 잡으면 종이의 누런 기가 색펜으로 오인된다.
  saturation_split_min_gap: 30      # 잉크 픽셀의 채도를 두 무리로 갈랐을 때, 두 무리의 평균
                             # 차이가 이보다 작으면 "색펜이 없다"고 보고 기본값을 쓴다.
                             # 실측 차이: 선명한 사진 110 / 화면 캡처 223 / 스캔 75
                             #            / **흑백으로 저장된 사진 22** (색펜이 정말 없다)
  saturation_colored_group_min: 40  # 갈라진 두 무리 중 "색이 있는 쪽"의 평균 채도가 이보다
                             # 낮으면 그건 색이 아니라 잡음이다.
                             # 실측: 선명 121 / 화면 캡처 228 / 스캔 86 / **흑백 사진 28**.
  value_min: 30              # 너무 어두운 픽셀(검정)은 채도가 튀어도 색펜으로 보지 않는다.
  # ── 컬러 인쇄를 색펜으로 오인하지 않기 위한 값들 ──────────────────────
  # 요즘 문제집에는 단원 제목 띠, 유형 아이콘, 색으로 인쇄된 문제 번호가 흔하다.
  # 채도만 보고 지우면 이것들이 통째로 사라진다(합성으로 재 보니 88% 가 지워졌다).
  # 실측(실제 시험지): 파란 인쇄 번호 획 두께 5.7~6.6px / 빨간 볼펜 13~42px
  print_text_max_thickness_px: 10   # 이보다 가는 색 글자가 인쇄 줄 위에 있으면 "인쇄"로 본다.
                             # 올리면 → 굵은 색펜 글씨까지 인쇄로 봐서 안 지운다(필기 잔존↑).
                             # 내리면 → 굵게 인쇄된 색 제목이 지워질 위험↑.
  print_text_min_fill: 0.28  # 글자형 인쇄로 인정할 최소 꽉참(넓이 ÷ 사각형 넓이).
                             # 아주 가늘고 성긴 획만 걸러내는 **약한** 조건이다.
                             # 실측으로 인쇄와 손글씨가 충분히 안 갈린다: 실제 사진의 파란
                             # 인쇄 문제번호가 0.34~0.59 이고 손글씨가 0.30 안팎이라 겹친다.
                             # (0.38 로 올려 봤더니 실제 사진의 문제번호 "0074" 중 한 자가
                             #  0.34 로 걸려 지워졌다. 그래서 낮춰 두었다.)
                             # 올리면 → 인쇄된 색 글자가 지워질 위험↑.
  print_solid_min_fill: 0.70 # 내부 구멍을 메웠을 때 사각형을 이만큼 이상 채우면 "면으로 인쇄된 것".
                             # 내리면 → 색펜으로 칠한 넓은 자국도 인쇄로 봐서 안 지운다.
  print_solid_max_hole_ratio: 0.15  # 가장 큰 내부 구멍이 사각형의 이 비율을 넘으면 인쇄가 아니다.
                             # 제목 띠는 흰 글자가 **자잘한 구멍 여러 개**를 뚫지만,
                             # 색펜 동그라미는 가운데에 **큰 구멍 하나**가 뚫린다.
                             # 이것이 둘을 가르는 가장 확실한 차이다(단순 꽉참은 띠 0.41 대
                             # 동그라미 0.30 으로 겹쳐서 구별이 안 됐다).
                             # 올리면 → 굵은 색펜 동그라미가 인쇄로 살아남는다.
  print_solid_min_side_px: 20   # 면형 인쇄로 인정할 최소 짧은 변. 가는 막대는 제외한다.
  # ── 가로로 놓인 굵은 띠(저해상도에서 꽉참이 무너져도 띠를 알아보기 위한 규칙) ──
  band_min_aspect: 3.0       # 너비가 높이의 이 배수 이상이어야 "가로 띠"다.
  band_thickness_to_height_min: 0.7   # 최대 두께가 높이의 이 비율 이상 = 속이 꽉 찬 띠.
                             # 실측: 인쇄 띠 0.92~0.97 / 펜 획은 획 굵기라 훨씬 작다.
  band_min_fill: 0.55        # 띠로 인정할 최소 꽉참(흰 글자가 번진 저해상도 띠 실측 0.61~0.74).
                             # 내리면 → 가로로 긴 굵은 펜 자국이 띠로 오인될 위험↑.
  print_solid_max_aspect: 8.0   # 이 비율보다 길쭉하면 "띠일 수도, 굵은 펜 획일 수도" 있다고 보고
                             # 아래의 더 엄격한 기준을 적용한다.
  print_solid_elongated_min_fill: 0.92  # 길쭉한 덩어리가 인쇄 띠로 인정받으려면 사각형을
                             # 이만큼 채워야 한다(= 축에 나란한 반듯한 직사각형이어야 한다).
                             # 실측: 제목 띠 484x39 → 1.00 / 비스듬한 굵은 빨간 펜 획 22x195 → 0.73.
                             # 내리면 → 굵은 펜 획이 인쇄 띠로 살아남는다.

  dilate_px: 2               # 지울 영역을 이만큼 부풀린다.
                             # 올리면 → 색펜 테두리 잔상이 덜 남지만, 밑의 인쇄 글자도 더 먹는다.
  inpaint_radius: 3          # 지운 자리를 주변 색으로 메우는 반경.
  min_blob_area_px: 12       # 이보다 작은 색 얼룩은 노이즈로 보고 무시.

# --- 3) 연필/검정 필기 점수 매기기 -----------------------------------------
stroke_filter:
  binarize_block_size: 35    # 적응형 이진화 창 크기(홀수).
                             # 올리면 → 넓은 명암 변화에 둔감, 내리면 → 노이즈↑.
  binarize_offset: 12        # 올리면 → 더 진한 것만 잉크로 본다(흐린 연필을 놓침).
  min_component_area_px: 15  # 이보다 작은 연결 요소는 먼지로 보고 버린다.

  # 손글씨 점수 = 아래 네 근거의 가중 평균 (합이 1이 되게 두면 해석이 쉽다)
  weight_density: 0.35       # 진하기 근거 비중 (인쇄는 진하고, 연필은 흐리다)
                             # → 실측: 같은 사진에서 인쇄 128 / 연필 77 로 가장 잘 갈리는 근거.
  weight_thickness: 0.10     # 획 두께 변화 근거 비중 (인쇄는 일정, 손글씨는 변화 큼)
                             # → 실측: 인쇄 0.262 / 연필 0.264 로 사실상 차이가 없었다.
                             #   그래서 비중을 낮게 두었다. 굵은 볼펜 필기가 많은 시험지에서는
                             #   올려서 실험해 볼 만하다.
  weight_fill: 0.25          # 획 꽉참(넓이 ÷ 사각형 넓이) 근거 비중
                             # → 실측: 인쇄 0.42 / 연필 0.30. 인쇄 글자는 네모를 빽빽이 채우고
                             #   손글씨는 크게 휘갈겨 성글다. 두께를 대신하는 근거다.
  weight_alignment: 0.30     # 인쇄 텍스트 줄 정렬 근거 비중 (줄 밖 = 필기일 가능성↑)
                             # → 단(column)을 먼저 나눈 뒤 단 안에서 줄을 찾는다(2단 편집 대응).

  remove_threshold: 0.65     # 점수가 이 값 이상 → "필기"(지움)
                             # 내리면 → 더 과감히 지움(필기 제거↑, 인쇄 오삭제↑)
  keep_threshold: 0.35       # 점수가 이 값 이하 → "인쇄"(안 지움)
                             # 두 값 사이가 "애매" 구간이고, 이 구간만 판정관에게 간다.
                             # ── 트레이드오프 ──
                             #   구간을 넓히면(remove↑ 또는 keep↓): 판정관 호출↑ → 비용↑,
                             #     대신 규칙이 틀릴 만한 획을 클로드가 봐주므로 정확도↑.
                             #   구간을 좁히면: 규칙 혼자 판단 → 비용 0, 정확도↓.
  text_line_min_gap_px: 4    # 가로 투영으로 텍스트 줄을 나눌 때의 최소 빈 줄 높이.
  # ── 회색으로 면을 채운 인쇄 부분(색칠된 반원·표 칸·막대) 판별 ──────────
  shaded_min_area_px: 1500   # 이보다 넓고
  shaded_min_fill: 0.55      # 사각형을 이 비율 이상 채우며       (손글씨는 0.30 안팎)
  shaded_max_darkness_std: 28   # 농도가 이만큼 고르면 → 채운 면(인쇄). 지키되 강조는 안 한다.
                             # 올리면 → 연필로 빽빽이 칠한 자국까지 인쇄로 봐서 안 지운다.
  # ── 큰 동그라미(고리)에 글자·도형이 붙어 버린 거대 덩어리 판별 ──────────
  # 색이 날아간 사진에서 빨간펜 동그라미는 못 지우고, 가로지르는 글자·도형과 한 덩어리가 된다.
  # 이런 덩어리를 통째로 지우면 문제가 사라진다. 지우지 않는다(동그라미가 남는 쪽이 낫다).
  ring_min_area_px: 3000     # 이보다 넓고
  ring_min_side_px: 80       # 사각형의 짧은 변도 이보다 크며
  ring_min_hole_ratio: 0.25  # 가장 큰 내부 구멍이 사각형의 이 비율 이상이면 → 고리 덩어리.
                             # 내리면 → 작은 구멍이 있는 필기 덩어리도 안 지운다(필기 잔존↑).
  reference_exclude_ring_min_area_px: 300     # 진하기 기준을 정할 때 뺄 "고리 모양" 요소의 최소 넓이
  reference_exclude_ring_min_hole_ratio: 0.25 # 가장 큰 내부 구멍이 사각형의 이 비율 이상이면 고리다.
                             # 색이 날아간 사진의 빨간펜 동그라미가 기준을 끌어올려 본문이 지워지는 것을 막는다.
  reference_max_component_area_ratio: 0.02   # 진하기 기준을 정할 때, 화면의 이 비율보다 큰
                             # 덩어리는 빼고 센다(글자만 한 것들로만 기준을 잡는다).
                             # 화면 캡처의 검은 여백, 큰 음영 면, 표의 채운 칸이 여기 걸린다.
                             # 올리면 → 큰 덩어리가 기준을 장악해 본문이 통째로 지워질 위험↑.
  protect_line_min_length_px: 30  # 이 길이 이상이면서 가늘고 진한 요소(분수 가로줄, 좌표축,
                             # 표 선)는 점수와 무관하게 그래프로 보호한다.
                             # 내리면 → 짧은 선까지 보호(학생 밑줄이 살아남을 위험↑).
                             # 올리면 → 짧은 분수 가로줄이 지워질 위험↑.

# --- 4) 그래프·도형 보호 및 강화 -------------------------------------------
graph_enhance:
  min_figure_area_px: 900    # 이보다 큰 연결 요소는 그래프·도형 후보로 본다.
                             # 내리면 → 작은 도형 조각도 보호하지만, 큰 필기 덩어리도 살아남는다.
  thickness_cv_max: 0.45     # 획 두께 변동계수가 이 값 이하면 "일정한 선" = 인쇄 도형으로 본다.
                             # 올리면 → 더 관대하게 도형으로 인정(손그림 곡선도 보호될 위험↑).
  figure_max_fill_ratio: 0.25   # 도형은 속이 빈 윤곽선이라 사각형을 성기게 채운다(0.1 안팎).
                             # 글자 덩어리는 빽빽하다(0.42). 이 값보다 빽빽하면 도형이 아니다.
                             # 올리면 → 본문 글자 덩어리가 도형으로 오인돼 새까맣게 굵어진다.
  rescue_score_ceiling: 0.95 # 손글씨 점수가 이 값을 넘으면 아무리 직선이어도 구제하지 않는다.
                             # 높게 둔 이유: 구제 여부는 점수가 아니라 아래의 **직선 덮임**으로
                             # 판단하는 것이 훨씬 정확하기 때문이다. 0.80 으로 두었더니
                             # 제본 쪽으로 흐려진 인쇄 좌표축(점수 0.81)이 걸려서 도형의
                             # 절반(48.6%)이 지워졌다.
  rescue_line_coverage_min: 0.70    # 필기로 분류된 요소를 도형으로 **되돌릴** 때 요구하는 직선 덮임.
                             # 실측: 인쇄 도형 0.84~0.95 / 학생이 손으로 그린 선 0.00. 여유를 두어 0.70.
                             # 내리면 → 학생이 자로 그은 선까지 도형으로 살아난다.
  line_coverage_min: 0.60    # 요소 픽셀 중 이 비율 이상이 "검출된 곧은 직선" 위에 놓여야
                             # 선 그림으로 인정한다.
                             # 실측: 인쇄 도형 0.91~0.95 / 학생이 손으로 그린 선 0.00.
                             # 사람이 그은 선은 흔들려서 Hough 가 직선으로 못 잡기 때문이다.
                             # 내리면 → 손그림도 도형으로 보호되어 새까맣게 강조된다.
  figure_min_darkness_ratio: 1.00   # "크고 성기고 두께 일정" 규칙으로 도형 승격할 때 요구하는
                             # 진하기(획 심지 ÷ 그 자리 인쇄 기준).
                             # 실측: 인쇄 도형선 1.56 / 학생 손그림선 0.88.
                             # 내리면 → 연필로 그린 큰 그림이 도형으로 보호된다.
  hough_min_line_length: 60  # 이 길이 이상 직선은 좌표축·표 선으로 보고 무조건 보호.
                             # 내리면 → 짧은 선도 보호(필기 밑줄까지 살 위험↑).
  hough_max_line_gap: 6
  closing_px: 3              # 끊긴 곡선을 잇는 정도. 올리면 → 잘 이어지지만 가까운 획이 붙는다.
  dilate_px: 1               # 남긴 그래프를 굵게 만드는 정도(1~2 권장).
                             # 올리면 → 더 진하고 굵게 보이지만 세밀한 격자가 뭉갠다.

# --- 5) 최종 마무리 --------------------------------------------------------
finalize:
  unsharp_amount: 1.2        # 인쇄 글자 대비 강화 강도.
                             # 올리면 → 글자가 또렷해지지만 종이 노이즈도 같이 도드라진다.
  unsharp_radius_px: 3
  text_darken_gamma: 0.8     # 1보다 작을수록 글자가 더 진해진다(0.6~0.9 권장).
  background_white_cutoff: 215  # 이 밝기 이상은 완전한 흰색(255)으로 만든다.
                             # 내리면 → 배경이 더 깨끗해지지만 아주 흐린 인쇄가 날아간다.
                             # ※ 감마 보정 앞뒤로 두 번 적용한다(뒤에만 하면 종이가 회색으로 남는다).
  bleed_through_cutoff: 205  # 뒷장 인쇄가 비쳐 보이는 것(bleed-through)을 지우는 기준.
                             # 이 밝기보다 밝은 것은 전부 흰색으로 만든다.
                             # 내리면 → 비침이 더 깨끗이 지워지지만 흐린 연필·흐린 인쇄도 사라진다.
                             # 실측: 이 사진의 인쇄 글자 밝기는 ~127 이라 205 는 안전한 거리다.
