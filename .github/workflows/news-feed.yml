# ============================================================
# 블록체인 뉴스 자동 수집 (서버 없이 GitHub 이 대신 실행)
#
# - 10분마다 뉴스를 수집하고, 새 '주목/중요' 뉴스를 텔레그램·디스코드로 보낸다.
# - 수집한 DB 와 타임라인 HTML 은 news-data 브랜치에 저장해 다음 실행 때 이어 쓴다.
# - Actions 탭에서 [Run workflow] 버튼으로 바로 실행해 볼 수도 있다.
#
# 주의: schedule(정해진 시간 실행)은 '기본 브랜치'에 있는 워크플로만 동작한다.
# ============================================================
name: news-feed

on:
  schedule:
    # 크론(cron) 표기: 분 시 일 월 요일 (UTC 기준)
    # */10 = 10분마다. GitHub 이 바쁘면 몇 분~수십 분 늦게 실행될 수 있다.
    - cron: "*/10 * * * *"
  workflow_dispatch:   # 수동 실행 버튼

# 이전 실행이 아직 안 끝났으면 다음 실행은 기다린다 (DB 를 동시에 고치지 않도록)
concurrency:
  group: news-feed
  cancel-in-progress: false

permissions:
  contents: write      # news-data 브랜치에 push 하기 위해 필요

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 코드 내려받기
        uses: actions/checkout@v4

      - name: 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: news_feed/requirements.txt

      - name: 패키지 설치
        run: pip install -r news_feed/requirements.txt

      - name: 지난 뉴스 데이터 불러오기
        run: bash .github/scripts/news_state.sh restore news-state

      - name: 뉴스 수집 · 알림
        env:
          NEWS_DB_PATH: news-state/news.db
          NEWS_HTML_PATH: news-state/index.html
          NEWS_ALERT_MIN_LEVEL: ${{ vars.NEWS_ALERT_MIN_LEVEL || '2' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python -m news_feed -v run

      - name: 뉴스 데이터 저장
        run: bash .github/scripts/news_state.sh save news-state
